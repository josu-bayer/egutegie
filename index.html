<!DOCTYPE html>
<html lang="eu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Egutegie">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Egutegie</title>
<style>
:root{
  --bg:#0f1115; --bg2:#151821; --panel:#1b2030; --line:#2a3042; --ink:#e8eaf0; --muted:#8b92a3;
  --accent:#5eead4; --accent2:#7aa2ff; --danger:#ff6b6b; --warn:#facc15;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px}
body{min-height:100vh;padding-bottom:calc(90px + var(--safe-b))}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%}
input[type=checkbox]{width:auto}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:.78rem;color:var(--muted);margin:12px 0 5px;font-weight:600}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(8px + var(--safe-t)) 12px 6px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:6px}
.grow{flex:1;min-width:0}
.ib{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:38px;height:38px;font-size:1.05rem;display:inline-flex;align-items:center;justify-content:center;position:relative;padding:0 8px}
.ib.on{border-color:var(--accent);color:var(--accent)}
.ttl{font-weight:800;font-size:1.05rem;text-align:center;padding:6px 4px;background:none;border:none;width:100%}
.ttl small{display:block;font-weight:500;color:var(--muted);font-size:.7rem}
.badge{position:absolute;top:-5px;right:-5px;background:var(--danger);color:#fff;border-radius:999px;font-size:.62rem;font-weight:800;min-width:17px;height:17px;display:none;align-items:center;justify-content:center;padding:0 4px}
.seg{display:flex;margin-top:8px;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.seg button{flex:1;border:none;background:var(--bg2);padding:8px 2px;font-weight:700;font-size:.82rem;color:var(--muted)}
.seg button.on{background:var(--accent);color:#06241f}
#pill{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-top:6px;display:inline-block}
#pill.ok{color:var(--accent);border-color:rgba(94,234,212,.4)}
#pill.pend{color:var(--warn);border-color:rgba(250,204,21,.4)}
#pill.off{color:var(--danger);border-color:rgba(255,107,107,.4)}
main{padding:10px 12px 0}
.dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:.7rem;color:var(--muted);font-weight:700;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cell{background:var(--panel);border:1px solid transparent;border-radius:9px;min-height:78px;padding:3px 2px;display:flex;flex-direction:column;align-items:stretch;gap:2px;font-size:.78rem;min-width:0;overflow:hidden}
.cell .n{align-self:center}
.lbls{display:flex;flex-direction:column;gap:2px;min-width:0}
.lbl{font-size:.54rem;line-height:1.12;font-weight:600;text-align:left;overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;padding:1px 2px;border-radius:3px;border-left:2.5px solid var(--c,#888);background:color-mix(in srgb,var(--c,#888) 22%,transparent);color:var(--ink)}
.lbl.ghost{border-left-style:dashed;background:none;border-top:1px dashed color-mix(in srgb,var(--c,#888) 50%,transparent);border-bottom:1px dashed color-mix(in srgb,var(--c,#888) 50%,transparent);border-right:1px dashed color-mix(in srgb,var(--c,#888) 50%,transparent)}
.lbl.imp{background:none;border:1px solid color-mix(in srgb,var(--c,#9aa) 60%,transparent);border-left:2.5px solid var(--c,#9aa)}
.cell.other{opacity:.38}
.cell.past{opacity:.5;filter:saturate(.45)}
.cell.past.other{opacity:.28}
.cell.past.sel{opacity:.8}
.pastday{opacity:.55;filter:saturate(.45)}
.cell.today .n{background:var(--accent);color:#06241f;border-radius:999px}
.cell.sel{border-color:var(--accent2)}
.cell .n{font-weight:700;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.dots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c,#888)}
.dot.ghost{background:none;border:1.5px dashed var(--c,#888)}
.dot.imp{border-radius:2px;background:none;border:1.5px solid var(--c,#9aa)}
.dot.ext{border-radius:2px;background:var(--c,#888);opacity:.6}
.more{font-size:.6rem;color:var(--muted)}
h3{margin:16px 0 8px;font-size:.85rem;color:var(--muted);text-transform:none;letter-spacing:.02em}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 6px;font-weight:800}
.dayhead small{color:var(--muted);font-weight:600}
.dayhead.today{color:var(--accent)}
.it{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c,#888);border-radius:11px;padding:9px 11px;margin-bottom:6px;width:100%;text-align:left}
.it .ico{font-size:1.2rem;width:26px;text-align:center}
.it .tx{flex:1;min-width:0}
.it .tx b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .tx small{color:var(--muted);font-size:.74rem}
.it .tag{font-size:.62rem;font-weight:800;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:1px 6px;white-space:nowrap}
.it.ghost{border-style:dashed;border-left-style:solid;background:transparent}
.it.imp{background:rgba(122,162,255,.07)}
.it.ext{background:rgba(255,255,255,.03);border-left-style:dotted}
.it.done{opacity:.55}
.it.done b{text-decoration:line-through}
.it.skipped{opacity:.4}
.empty{color:var(--muted);text-align:center;padding:18px 0;font-size:.85rem}
.fab{position:fixed;right:16px;bottom:calc(18px + var(--safe-b));width:56px;height:56px;border-radius:50%;background:var(--accent);color:#06241f;border:none;font-size:1.9rem;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.5);z-index:25;line-height:1}
#sheetRoot{position:fixed;inset:0;z-index:40;display:none}
#sheetRoot.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px 14px calc(18px + var(--safe-b));-webkit-overflow-scrolling:touch}
.sheet h2{margin:0 0 4px;font-size:1.05rem}
.btn{background:var(--accent);color:#06241f;border:none;border-radius:11px;padding:11px 16px;font-weight:800}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--danger);border:1px solid rgba(255,107,107,.5)}
.btn.sm{padding:6px 10px;font-size:.8rem;border-radius:9px}
.btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btns .grow{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:700}
.chip.on{background:var(--c,var(--accent));color:#06241f;border-color:transparent}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;background:var(--c)}
.sw.on{border-color:#fff}
.emo{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:1.2rem}
.emo.on{border-color:var(--accent);background:rgba(94,234,212,.15)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.card .row b{font-weight:700}
.note{font-size:.76rem;color:var(--muted);line-height:1.45;margin:8px 0 0}
.note.warn{color:var(--warn)}
.stepline{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.stepline input[type=text]{flex:1}
.mini{width:34px;height:34px;border-radius:9px;background:var(--panel);border:1px solid var(--line);padding:0}
.sw-row{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + var(--safe-b));background:#272d40;border:1px solid var(--line);padding:9px 14px;border-radius:11px;z-index:60;font-size:.85rem;display:none;max-width:88vw}
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <button class="ib" id="bPrev" aria-label="‹">‹</button>
    <div class="grow"><button class="ttl" id="title"></button></div>
    <button class="ib" id="bNext" aria-label="›">›</button>
    <button class="ib" id="bBell" aria-label="Abisuak">🔔<span class="badge" id="bellN"></span></button>
    <button class="ib" id="bLayers" aria-label="Geruzak">◧</button>
    <button class="ib" id="bRefresh" aria-label="Freskatu">⟳</button>
    <button class="ib" id="bSet" aria-label="Ezarpenak">☰</button>
  </div>
  <div class="seg" id="seg"></div>
  <span id="pill"></span>
</header>
<main id="main"></main>
<button class="fab" id="fab" aria-label="Gehitu">+</button>
<div id="sheetRoot"><div class="scrim" id="scrim"></div><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc }
  from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

/* ============================================================
   UI strings. Basque, western Bizkaian.
   T_OK      = forms Josu confirmed in earlier apps (memory notes), reused verbatim.
   T_REVIEW  = words with no confirmed dialect form. Written in plain standard Basque
               on purpose (no invented dialect forms) and listed for Josu's review
               in testuak_berrikusteko.md (generated from this block).
   ============================================================ */
const T_OK = {
  monthNames: ['Urtarrile', 'Zezeile', 'Martie', 'Aprile', 'Maiatze', 'Bagile', 'Garagarrile', 'Agustue', 'Iraile', 'Urrie', 'Zemendie', 'Abendue'],
  dayNames: ['astelena', 'martitzena', 'eguztena', 'eguena', 'barikue', 'zapatue', 'domeka'],
  gehitu: 'Gehitu', gorde: 'Gorde', ezabau: 'Ezabau', editau: 'Editau', ezarpenak: 'Ezarpenak',
  data: 'Data', izena: 'Izena', gaur: 'Gaur', ziur: 'Ziur zauz?',
  syncOk: 'Sinkronizeuta', syncNo: 'Ez dau sinkronizeuta', offline: 'Offline',
  gosaria: 'Gosaria', bazkaria: 'Bazkaria', afaria: 'Afaria'              // as shown in Sutelagun
};
// REVIEW START
const T_REVIEW = {
  dayInit: ['A', 'M', 'E', 'E', 'B', 'Z', 'D'],                          // initials of the confirmed day names
  vMonth: 'Hilabetea', vWeek: 'Astea', vDay: 'Eguna', vAgenda: 'Agenda',
  hutsik: 'Ezer ez', utzi: 'Utzi', itxi: 'Itxi',
  izenburua: 'Izenburua', mota: 'Mota', motak: 'Motak', motarikGabe: 'Motarik gabe',
  egunOsoa: 'Egun osoa', hasiera: 'Hasiera', amaiera: 'Amaiera', oharrak: 'Oharrak',
  abisua: 'Abisua', abisurikEz: 'Abisurik ez',
  lead10: '10 minutu lehenago', lead30: '30 minutu lehenago', lead60: '1 ordu lehenago', lead120: '2 ordu lehenago',
  lead1440: '1 egun lehenago', lead2880: '2 egun lehenago',
  abisuAzalpena: 'Abisu-emailak minutu bat edo bi berandu iritsi daitezke. Ez dira berehalakoak.',
  izenburuaBeharra: 'Izenburua falta da', dataBeharra: 'Data falta da', izenaBeharra: 'Izena falta da',
  zikloBeharra: 'Izena eta gutxienez 2 pauso behar dira',
  googleIrakurtzeSoilik: 'Google Egutegitik ekarria. Irakurtzeko soilik.',
  kanpokoIrakurtzeSoilik: 'Beste aplikazioetako datuak irakurtzeko soilik dira. Hemendik ez da ezer aldatzen.',
  egina: 'Egina', saltau: 'Saltau', desegin: 'Desegin', mugitu: 'Mugitu',
  mugituEgunak: 'Mugitu (egun kopurua, negatiboa lehenago)',
  ezinMugitu: 'Ezin da egun horretara mugitu',
  zikloAzalpena: 'Zikloa ez dago asteko egunen menpe. Saltatu edo mugitzean, hurrengo egun guztiak berriro kalkulatzen dira.',
  azkenAldaketa: 'azken aldaketa',
  pausoak: 'Pausoak', pausoaGehitu: 'Pausoa', eremuaGehitu: 'Eremua', eremuGehigarriak: 'Eremu gehigarriak',
  gaurZeinPauso: 'Gaur zein pauso da?',
  kolorea: 'Kolorea', ikonoa: 'Ikonoa', testua: 'Testua', zenbakia: 'Zenbakia', kutxa: 'Kutxa',
  zikloak: 'Zikloak', lZikloak: 'Zikloak', lGoogle: 'Google Egutegia', geruzak: 'Geruzak',
  gaurkoAbisuak: 'Gaurko abisuak', bidalita: 'Bidalita', zain: 'Zain',
  esportatuIcs: 'Esportatu (.ics)', abisuProba: 'Abisu-proba sortu',
  probaSortua: 'Proba sortuta. Email bat iritsi beharko litzateke minutu pare batean.',
  freskatzen: 'Freskatzen…',
  errepikapena: 'Errepikapena', errEz: 'Ez da errepikatzen', errEgunero: 'Egunero', errAstero: 'Astero', errHilero: 'Hilero', errUrtero: 'Urtero',
  errTartea: 'Tartea (zenbatero)', errArte: 'Arte (hautazkoa)', errEgunak: 'Asteko egunak',
  errOharra: 'Errepikatzen diren gertaerek ez dute abisu-emailik. Egunero goizeko emailean agertzen dira.',
  ezabauEgunHau: 'Egun hau bakarrik ezabau'
};
// REVIEW END
const T = Object.assign({}, T_OK, T_REVIEW);

/* ============================================================
   Firebase (project YOUR_PROJECT_ID, open rules, no auth)
   ============================================================ */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT_ID.firebasestorage.app",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID88"
};
const fbApp = initializeApp(firebaseConfig);
const db = initializeFirestore(fbApp, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
});
const C = {
  ev: collection(db, 'gertaerak'),
  ty: collection(db, 'motak'),
  cy: collection(db, 'zikloak'),
  im: collection(db, 'importatuak')
};
const settingsRef = doc(db, 'ezarpenak', 'nagusia');

// Offline, a write promise only resolves once the server acks. Race it so forms never lock up.
function race(p) {
  return Promise.race([
    p.catch(e => { toast('Errorea: ' + (e && e.message || e)); }),
    new Promise(r => setTimeout(r, 1200))
  ]);
}
const fsSet = (ref, data, opts) => race(setDoc(ref, data, opts || {}));
const fsDel = ref => race(deleteDoc(ref));
const fsUpd = (ref, data) => race(updateDoc(ref, data));
const newId = col => doc(col).id;

/* ============================================================
   Date helpers (local calendar dates as YYYY-MM-DD strings)
   ============================================================ */
const pad = n => String(n).padStart(2, '0');
const ds = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addD = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); };
const diffD = (a, b) => {
  const [ay, am, ad] = a.split('-').map(Number), [by, bm, bd] = b.split('-').map(Number);
  return Math.round((Date.UTC(by, bm - 1, bd) - Date.UTC(ay, am - 1, ad)) / 864e5);
};
const wd = s => (pd(s).getDay() + 6) % 7;          // Monday = 0
const todayS = () => ds(new Date());
const monthStart = s => s.slice(0, 7) + '-01';
const addMonths = (s, n) => { const d = pd(monthStart(s)); d.setMonth(d.getMonth() + n); return ds(d); };
const weekStart = s => addD(s, -wd(s));
const mins = hhmm => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const longDay = s => T.dayNames[wd(s)] + ', ' + pd(s).getDate() + ' ' + T.monthNames[pd(s).getMonth()].toLowerCase();

// Epoch ms of the moment a reminder fires. All-day events count from 09:00 of that day.
function reminderAt(dateS, startS, allDay, leadMin) {
  const [y, m, d] = dateS.split('-').map(Number);
  const hhmm = (!allDay && startS) ? startS : '09:00';
  const [h, mi] = hhmm.split(':').map(Number);
  return new Date(y, m - 1, d, h, mi).getTime() - leadMin * 60000;
}

/* ============================================================
   State
   ============================================================ */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('egutegie.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('egutegie.' + k, JSON.stringify(v)); } catch (e) { } }
};
const S = {
  view: LS.get('view', 'month'),
  cur: todayS(),
  sel: todayS(),
  events: [], types: [], cycles: [], imported: [], settings: {},
  layers: Object.assign({ cycles: true, google: true, ascension: true, sutelagun: true }, LS.get('layers', {})),
  hiddenTypes: LS.get('hiddenTypes', []),
  ext: {},
  meta: { ev: {}, ty: {}, cy: {}, im: {} },
  online: navigator.onLine
};
const PALETTE = ['#ff6b6b', '#fb923c', '#facc15', '#34d399', '#5eead4', '#4da3ff', '#a78bfa', '#f472b6', '#9ca3af'];
const EMOJIS = ['📚', '🏋️', '📝', '⏰', '🎓', '💼', '🍽️', '🏃', '🧘', '🎮', '🎬', '✈️', '🩺', '🛒', '🎂', '👥', '📞', '💡', '🔧', '⭐', '🏠', '🚗', '🎵', '💰'];

/* ============================================================
   Firestore listeners + sync status
   ============================================================ */
function listen(key, ref, store) {
  onSnapshot(ref, { includeMetadataChanges: true }, snap => {
    S.meta[key] = { fromCache: snap.metadata.fromCache, pending: snap.metadata.hasPendingWrites };
    S[store] = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    render();
  }, err => { console.warn('listen', key, err); });
}
listen('ev', C.ev, 'events');
listen('ty', C.ty, 'types');
listen('cy', C.cy, 'cycles');
listen('im', C.im, 'imported');
onSnapshot(settingsRef, snap => { S.settings = snap.exists() ? snap.data() : {}; });

function syncText() {
  const pend = Object.values(S.meta).some(m => m.pending);
  const cache = Object.values(S.meta).every(m => m.fromCache === undefined || m.fromCache);
  if (!S.online) return ['off', T.offline + (pend ? ' · ' + T.syncNo : '')];
  if (pend) return ['pend', T.syncNo];
  if (cache && Object.values(S.meta).some(m => m.fromCache !== undefined)) return ['pend', T.offline];
  return ['ok', T.syncOk];
}
window.addEventListener('online', () => { S.online = true; refreshExt(true); render(); });
window.addEventListener('offline', () => { S.online = false; render(); });

/* ============================================================
   Cycles ("rolling cycles"): a counter that advances one step per calendar day from an
   anchor (date + step). It is NOT tied to weekdays. Skipping or shifting a day moves
   the anchor, so every later day recomputes. Past days are read from `historia`.
   (Idea borrowed from Ascension System's counter-based routine engine, reimplemented.)
   ============================================================ */
function cycStep(c, date) {
  const n = (c.pausoak || []).length;
  if (!n) return null;
  const h = (c.historia || {})[date];
  if (date >= todayS() && c.ainguraData && date >= c.ainguraData) {
    const p = (((c.ainguraPausoa || 0) + diffD(c.ainguraData, date)) % n + n) % n;
    return { p, e: (h && h.p === p && h.e === 'egina') ? 'egina' : null };
  }
  return h ? { p: h.p, e: h.e } : null;
}
async function cycAct(cid, date, act, k) {
  const c = S.cycles.find(x => x.id === cid); if (!c) return;
  const st = cycStep(c, date); if (!st) return;
  const hist = Object.assign({}, c.historia || {});
  const undo = { ad: c.ainguraData || null, ap: c.ainguraPausoa || 0, date, had: hist[date] || null };
  let ad = c.ainguraData, ap = c.ainguraPausoa || 0;
  if (act === 'egina') { hist[date] = { p: st.p, e: 'egina' }; }
  else if (act === 'desegin-egina') { delete hist[date]; }
  else if (act === 'saltatuta') { hist[date] = { p: st.p, e: 'saltatuta' }; ad = addD(date, 1); ap = st.p; }
  else if (act === 'mugitu') {
    const nd = addD(date, k);
    if (!k || nd < todayS()) { toast(T.ezinMugitu); return; }
    ad = nd; ap = st.p;
  }
  await fsUpd(doc(db, 'zikloak', cid), { historia: hist, ainguraData: ad, ainguraPausoa: ap, desegin: undo });
}
async function cycUndo(cid) {

  const u = c.desegin, hist = Object.assign({}, c.historia || {});

/* ============================================================
   READ-ONLY ADAPTERS for other apps  (add a new one = add an object to ADAPTERS)
   Each adapter: { id, izena, kolorea, load() -> { 'YYYY-MM-DD': [ {title, icon, sub, done?, order?} ] } }
   They only ever GET from the other project's Firestore REST API. Nothing is written back.
   ============================================================ */
function fv(v) {                    // decode a Firestore REST value
  if (!v) return null;
  if ('stringValue' in v) return v.stringValue;
  if ('integerValue' in v) return Number(v.integerValue);
  if ('doubleValue' in v) return v.doubleValue;
  if ('booleanValue' in v) return v.booleanValue;
  if ('nullValue' in v) return null;
  if ('timestampValue' in v) return v.timestampValue;
  if ('mapValue' in v) { const o = {}; const f = v.mapValue.fields || {}; for (const k in f) o[k] = fv(f[k]); return o; }
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(fv);
  return null;
}
const fdoc = d => { const o = {}; for (const k in (d.fields || {})) o[k] = fv(d.fields[k]); return o; };

/* ---- ADAPTER 1: Ascension System (project YOUR_ASCENSION_PROJECT_ID, users/{uid}) -----------
   Josu's account uses the legacy PPL cycle: push,pull,legs,push,pull,legs,rest at S.cycleIndex.
   It only advances when a Gate is cleared, so future days are a projection ("done every day"). */
const ASC = { project: 'YOUR_ASCENSION_PROJECT_ID', uid: 'EXAMPLE_UID' };
const ASC_CYCLE = ['push', 'pull', 'legs', 'push', 'pull', 'legs', 'rest'];
const ASC_GATES = {
  push: { n: 'PUSH', i: '🔴', c: '#ff6b6b' }, pull: { n: 'PULL', i: '🔵', c: '#4da3ff' },
  legs: { n: 'LEGS', i: '🟣', c: '#a855f7' }, rest: { n: 'REST', i: '😴', c: '#8b92a3' }
};
const ASC_COLORS = { red: '#ff6b6b', cyan: '#4da3ff', violet: '#a855f7', green: '#34d399', gold: '#facc15', orange: '#fb923c' };
async function loadAscension() {
  const fields = ['cycleIndex', 'activeRoutineId', 'customRoutines', 'customTrainingSlot', 'customDayPointer', 'day', 'gateDoneToday', 'gateHalfToday'];
  const url = `https://firestore.googleapis.com/v1/projects/${ASC.project}/databases/(default)/documents/users/${ASC.uid}?` +
    fields.map(f => 'mask.fieldPaths=' + f).join('&');
  const r = await fetch(url); if (!r.ok) throw new Error('ascension ' + r.status);
  const s = fdoc(await r.json());
  const today = todayS();
  const doneToday = s.day === today && !!(s.gateDoneToday || s.gateHalfToday);
  const pendingRoll = s.day && s.day < today && !!(s.gateDoneToday || s.gateHalfToday); // cleared on an older day, rollover not run yet
  const out = {};
  const routine = (s.customRoutines || []).find(x => x.id === s.activeRoutineId);
  let slot = s.customTrainingSlot || 0, ptr = s.customDayPointer || 0, idx = s.cycleIndex || 0;
  const adv = () => {
    if (routine) {
      const cyc = routine.restCycle || 6, n = Math.max(1, (routine.days || []).length);
      if (slot >= cyc) slot = 0; else { slot++; ptr = (ptr + 1) % n; }
    } else idx = (idx + 1) % ASC_CYCLE.length;
  };
  if (pendingRoll) adv();
  for (let k = 0; k < 28; k++) {
    const date = addD(today, k);
    let item;
    if (routine) {
      const cyc = routine.restCycle || 6;
      if (slot >= cyc) item = { title: 'REST', icon: ASC_GATES.rest.i, color: ASC_GATES.rest.c };
      else {
        const d = (routine.days || [])[ptr % Math.max(1, (routine.days || []).length)] || { name: 'Training' };
        item = { title: d.name, icon: d.icon || '🏋️', color: ASC_COLORS[d.color] || '#4da3ff' };
      }
    } else {
      const g = ASC_GATES[ASC_CYCLE[idx]];
      item = { title: g.n, icon: g.i, color: g.c };
    }
    item.sub = 'Ascension System'; item.done = k === 0 && doneToday; item.order = -1;
    (out[date] = out[date] || []).push(item);
    adv();
  }
  return out;
}

/* ---- ADAPTER 2: Sutelagun (project sutelagun: ezarpenak/dieta + errezetak) --------------
   Same slot-cursor logic as Sutelagun's own slotZikloEguna(): today shows each slot's cursor,
   later days project assuming one step per day. */
async function loadSutelagun() {
  const base = 'https://firestore.googleapis.com/v1/projects/YOUR_SUTELAGUN_PROJECT_ID/databases/(default)/documents';
  const r = await fetch(base + '/ezarpenak/dieta'); if (!r.ok) throw new Error('sutelagun ' + r.status);
  const dieta = fdoc(await r.json());
  const names = {};
  let tok = '';
  do {
    const rr = await fetch(base + '/errezetak?pageSize=300&mask.fieldPaths=izena' + (tok ? '&pageToken=' + encodeURIComponent(tok) : ''));
    if (!rr.ok) throw new Error('sutelagun recipes ' + rr.status);
    const j = await rr.json();
    (j.documents || []).forEach(d => { names[d.name.split('/').pop()] = (fdoc(d).izena) || '?'; });
    tok = j.nextPageToken || '';
  } while (tok);
  const days = dieta.zikloEgunak || [], n = days.length, out = {};
  if (!n) return out;
  const slots = [['gosaria', '🍳', T.gosaria], ['bazkaria', '🍲', T.bazkaria], ['afaria', '🌙', T.afaria]];
  const today = todayS();
  for (let k = 0; k < 14; k++) {
    const date = addD(today, k);
    slots.forEach(([slot, icon, label], si) => {
      let idx, biraka;
      const cur = dieta.aurrerapena && dieta.aurrerapena[slot];
      if (cur != null) {
        const raw = k > 0 ? cur + k : cur;
        const lap = k > 0 ? Math.floor(raw / n) : 0;
        biraka = ((dieta.aurrerapenaBiraka || {})[slot] || 0) + lap;
        idx = ((raw % n) + n) % n;
      } else {
        if (!dieta.zikloHasieraData) return;
        idx = (((diffD(dieta.zikloHasieraData, date)) % n) + n) % n; biraka = 0;
      }
      const eg = days[idx] || {};
      const vars = eg[slot + 'Varianteak'];
      const id = (Array.isArray(vars) && vars.length) ? vars[((biraka % vars.length) + vars.length) % vars.length] : eg[slot + 'Id'];
      if (!id) return;
      (out[date] = out[date] || []).push({ title: names[id] || '?', icon, sub: label, order: 1500 + si });
    });
  }
  return out;
}

/* ============================================================
   Items per day (everything the views draw comes from here)
   ============================================================ */
const typeOf = id => S.types.find(t => t.id === id);
// Does event `e` fall on `date`? Handles the optional repeat rule e.errepikapena =
// { mota: egunero|astero|hilero|urtero, tartea, egunak:[0..6 Mon=0], arte, salbuetsiak:[dates] }
function occurs(e, date) {
  const r = e.errepikapena;
  if (r && (r.salbuetsiak || []).includes(date)) return false;
  if (e.data === date) return true;
  if (!r || date < e.data) return false;
  if (r.arte && date > r.arte) return false;
  const n = Math.max(1, r.tartea || 1), a = pd(e.data), b = pd(date);
  if (r.mota === 'egunero') return diffD(e.data, date) % n === 0;
  if (r.mota === 'astero') {
    const days = (r.egunak && r.egunak.length) ? r.egunak : [wd(e.data)];
    return days.includes(wd(date)) && (diffD(weekStart(e.data), weekStart(date)) / 7) % n === 0;
  }
  if (r.mota === 'hilero') return (((b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth()) % n === 0) && b.getDate() === a.getDate();
  if (r.mota === 'urtero') return ((b.getFullYear() - a.getFullYear()) % n === 0) && b.getMonth() === a.getMonth() && b.getDate() === a.getDate();
  return false;
}
function itemsFor(date) {
  const out = [];
  S.events.filter(e => occurs(e, date)).forEach(e => {
    const t = typeOf(e.motaId);
    if (S.hiddenTypes.includes(e.motaId || '_')) return;
    out.push({
      kind: 'own', id: e.id, title: e.izenburua || '', icon: t ? t.ikonoa : '•', color: t ? t.kolorea : '#9ca3af',
      sub: (e.egunOsoa ? T.egunOsoa : (e.hasiera ? e.hasiera + (e.amaiera ? '–' + e.amaiera : '') : '')) + (t ? (e.egunOsoa || e.hasiera ? ' · ' : '') + t.izena : ''),
      order: e.egunOsoa ? -3 : (e.hasiera ? mins(e.hasiera) : 1439), bell: e.abisuaNoiz != null && !e.errepikapena, sent: !!e.bidalita, rep: !!e.errepikapena, date
    });
  });
  if (S.layers.cycles) S.cycles.forEach(c => {
    const st = cycStep(c, date); if (!st) return;
    const p = (c.pausoak || [])[st.p]; if (!p) return;
    out.push({
      kind: 'ghost', cid: c.id, date, title: p.izena, icon: p.ikonoa || '○', color: p.kolorea || '#7aa2ff',
      sub: c.izena, state: st.e, order: -2
    });
  });
  if (S.layers.google) S.imported.filter(e => e.data === date).forEach(e => {
    out.push({
      kind: 'imp', id: e.id, title: e.izenburua || '', icon: '📅', color: '#7aa2ff',
      sub: e.egunOsoa ? T.egunOsoa : (e.hasiera ? e.hasiera + (e.amaiera ? '–' + e.amaiera : '') : ''),
      order: e.egunOsoa ? -3 : (e.hasiera ? mins(e.hasiera) : 1439)
    });
  });
  ADAPTERS.forEach(a => {
    if (!S.layers[a.id]) return;
    ((S.ext[a.id] || {}).items || {})[date] && S.ext[a.id].items[date].forEach(x => {
      out.push({ kind: 'ext', src: a.id, title: x.title, icon: x.icon, color: x.color || a.kolorea, sub: x.sub, done: x.done, order: x.order == null ? 1500 : x.order });
    });
  });
  return out.sort((a, b) => a.order - b.order);
}

/* ============================================================
   .ics export (own events only; floating local times)
   ============================================================ */
function icsEsc(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;'); }
function fold(line) { const out = []; while (line.length > 72) { out.push(line.slice(0, 72)); line = ' ' + line.slice(72); } out.push(line); return out.join('\r\n'); }
function buildIcs() {
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Egutegie//EU', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Egutegie'];
  const stamp = new Date().toISOString().replace(/[-:]|\.\d+/g, '');
  const dt = (d, h) => d.replace(/-/g, '') + (h ? 'T' + h.replace(':', '') + '00' : '');
  S.events.slice().sort((a, b) => (a.data + (a.hasiera || '')).localeCompare(b.data + (b.hasiera || ''))).forEach(e => {
    const t = typeOf(e.motaId);
    L.push('BEGIN:VEVENT', 'UID:' + e.id + '@egutegie', 'DTSTAMP:' + stamp, 'SUMMARY:' + icsEsc(e.izenburua));
    if (e.egunOsoa || !e.hasiera) { L.push('DTSTART;VALUE=DATE:' + dt(e.data), 'DTEND;VALUE=DATE:' + dt(addD(e.data, 1))); }
    else {
      L.push('DTSTART:' + dt(e.data, e.hasiera));
      L.push('DTEND:' + dt(e.data, e.amaiera || e.hasiera));
    }
    if (e.errepikapena) {
      const r = e.errepikapena, F = { egunero: 'DAILY', astero: 'WEEKLY', hilero: 'MONTHLY', urtero: 'YEARLY' }[r.mota];
      const BD = ['MO', 'TU', 'WE', 'TH', 'FR', 'SA', 'SU'];
      L.push('RRULE:FREQ=' + F + ';INTERVAL=' + (r.tartea || 1) + (r.mota === 'astero' && (r.egunak || []).length ? ';BYDAY=' + r.egunak.map(i => BD[i]).join(',') : '') + (r.arte ? ';UNTIL=' + dt(r.arte) : ''));
      (r.salbuetsiak || []).forEach(x => L.push((e.egunOsoa || !e.hasiera ? 'EXDATE;VALUE=DATE:' + dt(x) : 'EXDATE:' + dt(x, e.hasiera))));
    }
    if (e.oharrak) L.push('DESCRIPTION:' + icsEsc(e.oharrak));
    if (t) L.push('CATEGORIES:' + icsEsc(t.izena));
    if (e.abisuMin != null) L.push('BEGIN:VALARM', 'TRIGGER:-PT' + e.abisuMin + 'M', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(e.izenburua), 'END:VALARM');
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.map(fold).join('\r\n') + '\r\n';
}
function exportIcs() {
  const blob = new Blob([buildIcs()], { type: 'text/calendar;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'egutegie.ics';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast(S.events.length + ' ✓');
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (f) f(el.dataset);
});
document.addEventListener('change', e => {
  if (e.target.id === 'ev-type') { D.extras = Object.assign(D.extras || {}, readExtras()); $('ev-extras').innerHTML = extrasHtml(e.target.value, D.extras); }
  if (e.target.id === 'ev-allday') $('ev-times').style.display = e.target.checked ? 'none' : '';
  if (e.target.id === 'ev-rep') {
    const m = e.target.value;
    $('ev-repbox').style.display = m ? '' : 'none'; $('ev-wdbox').style.display = m === 'astero' ? '' : 'none';
    $('ev-lead').disabled = !!m; if (m) $('ev-lead').value = '';
  }
  if (e.target.classList && e.target.classList.contains('ev-wd')) e.target.parentElement.classList.toggle('on', e.target.checked);
});
$('scrim').addEventListener('click', closeSheet);
$('fab').addEventListener('click', () => editEvent(null, S.view === 'month' || S.view === 'day' || S.view === 'week' ? S.sel : todayS()));
$('bPrev').addEventListener('click', () => nav(-1));
$('bNext').addEventListener('click', () => nav(1));
function nav(n) {
  if (S.view === 'month') { S.cur = addMonths(S.cur, n); S.sel = S.cur.slice(0, 7) === todayS().slice(0, 7) ? todayS() : monthStart(S.cur); }
  else if (S.view === 'week') { S.cur = addD(S.cur, 7 * n); S.sel = S.cur; }
  else if (S.view === 'day') { S.cur = addD(S.cur, n); S.sel = S.cur; }
  else { S.cur = addD(S.cur, 14 * n); S.sel = S.cur; }
  render();
}
$('title').addEventListener('click', () => { S.cur = todayS(); S.sel = todayS(); render(); });
$('bBell').addEventListener('click', bellSheet);
$('bLayers').addEventListener('click', layersSheet);
$('bSet').addEventListener('click', settingsSheet);
$('bRefresh').addEventListener('click', async () => {
  toast(T.freskatzen);
  try { const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r => r.update())); } catch (e) { }
  await refreshExt(true);
  setTimeout(() => location.reload(), 400);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { S.online = navigator.onLine; refreshExt(); render(); } });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
render();
refreshExt();
</script>
</body>
</html>
